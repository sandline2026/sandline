<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #111827;
      font-family: 'Montserrat', sans-serif;
      color: #FFFFFF;
      position: relative;
    }
    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(17,24,39,0.35) 0%, rgba(17,24,39,0.15) 40%, rgba(17,24,39,0.85) 75%, rgba(17,24,39,0.98) 100%);
    }
    .top-bar {
      position: absolute;
      top: 60px;
      left: 70px;
      right: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .brand-logo {
      height: 48px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    }
    .badge {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.35);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #FBBF24;
    }
    .content-box {
      position: absolute;
      bottom: 70px;
      left: 70px;
      right: 70px;
      z-index: 10;
    }
    .tagline {
      font-size: 16px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #FBBF24;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 58px;
      line-height: 1.15;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 18px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .subtitle {
      font-size: 20px;
      line-height: 1.5;
      color: rgba(255,255,255,0.88);
      max-width: 820px;
      margin-bottom: 30px;
      font-weight: 400;
    }
    .cta-card {
      background: #FAF8F5;
      color: #111827;
      border-radius: 20px;
      padding: 24px 30px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .cta-code {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      font-weight: 700;
      color: #D97706;
      letter-spacing: 2px;
    }
    .cta-site {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      letter-spacing: 1px;
    }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 20px;
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      font-weight: 600;
    }
  </style>
</head>
